name: tower_inspection
description: "Cross-platform tower site inspection field app (Android + iOS)."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State management (lightweight, stable)
  provider: ^6.1.2

  # Local persistence
  sqflite: ^2.3.3
  sqflite_common_ffi: ^2.3.3   # desktop/CI test support
  path: ^1.9.0
  path_provider: ^2.1.4

  # Camera & photos
  image: ^4.5.4
  image_picker: ^1.1.2
  permission_handler: ^11.3.1

  # Reports
  pdf: ^3.11.1
  printing: ^5.13.2

  # Share (native sheets)
  share_plus: ^10.0.2

  # Misc
  intl: ^0.19.0
  uuid: ^4.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/canonical_form_schema.json
